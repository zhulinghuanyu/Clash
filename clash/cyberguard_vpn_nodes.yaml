port: 7890
socks-port: 7891
allow-lan: true
bind-address: '*'
ipv6: false
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
- {name: CyberGuard-VPN-SS, server: v2ray.cool, port: 10086, type: ss, cipher: chacha20, password: 123456}
- {name: CyberGuard-VPN-v2ray.cool, server: v2ray.cool, port: 10086, type: vmess, uuid: a3482e88-686a-4a58-8126-99c9df64b7bf, alterId: 0, cipher: auto, tls: false, skip-cert-verify: true}
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - CyberGuard-VPN-SS
  - CyberGuard-VPN-v2ray.cool
- name: ♻️ 自动选择
  type: url-test
  proxies:
  - CyberGuard-VPN-SS
  - CyberGuard-VPN-v2ray.cool
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🚀 节点选择
  - ♻️ 自动选择
rules:
- GEOIP,LAN,DIRECT
- GEOIP,CN,DIRECT
- MATCH,🐟 漏网之鱼
