name: Convert Subscriptions to Clash

on:
  schedule:
    # 每小时整点执行
    - cron: '0 * * * *'
  workflow_dispatch:   # 支持手动触发

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run convert script
        env:
          # 可换成自己的 subconverter 地址
          SUBCONVERTER: https://api.v1.mk/sub
        run: python scripts/convert.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clash/

          if git diff --staged --quiet; then
            echo "没有内容变化，跳过提交"
          else
            git commit -m "chore: update Clash subscriptions $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
